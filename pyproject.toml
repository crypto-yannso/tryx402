[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tryx402"
version = "0.1.0"
description = "The OpenRouter for agent payments: budget router, idempotency, cost ledger, and multi-currency billing over x402."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tryx402 = "tryx402.cli:main"
gateway = "gateway.cli:main"
prospect-relay = "prospect_relay.cli:main"

[tool.setuptools]
packages = ["tryx402", "gateway", "prospect_relay"]
