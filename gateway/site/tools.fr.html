<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tryx402 — Catalogue des Outils M2M & x402</title>
  <meta name="description" content="Explorez l'annuaire des microservices et APIs payantes x402 consommables par les agents IA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0e0c;
      --bg-raised: #161411;
      --bg-inset: #1a1713;
      --ink: #ece7dd;
      --muted: #9b9488;
      --faint: #655f55;
      --border: #2a2620;
      --border-strong: #3a342b;
      --accent: #ff5c1a;
      --accent-soft: rgba(255, 92, 26, 0.12);
      --good: #7fb069;
      --warn: #d9a441;
      --bad: #d95d4a;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --maxw: 1040px;
      --r-sm: 6px;
      --r-md: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }
    .container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
    
    /* Nav */
    .nav { border-bottom: 1px solid var(--border); background: rgba(15, 14, 12, 0.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 50; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-decoration: none; color: var(--ink); }
    .logo em { color: var(--accent); font-style: normal; }
    .nav-links { display: flex; align-items: center; gap: 20px; font-size: 14px; }
    .nav-links a { color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .btn-cta { background: var(--accent); color: #fff; padding: 8px 16px; border-radius: var(--r-sm); font-weight: 600; text-decoration: none; font-size: 13px; }
    .btn-cta:hover { opacity: 0.9; }

    /* Header */
    .hero-head { padding: 48px 0 32px; border-bottom: 1px solid var(--border); margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: gap; gap: 20px; }
    .tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px; }
    h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 8px; }
    .lede { color: var(--muted); font-size: 15px; max-width: 620px; }

    /* Controls */
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tools-count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

    /* Tools Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
    .tool-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 22px;
      display: flex;
      flex-col: column;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s, transform 0.15s;
    }
    .tool-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .tool-slug { font-family: var(--font-mono); font-size: 16px; font-weight: 600; color: var(--ink); }
    .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-active { background: rgba(127, 176, 105, 0.12); color: var(--good); border: 1px solid rgba(127, 176, 105, 0.25); }
    .badge-pending { background: rgba(217, 164, 65, 0.12); color: var(--warn); border: 1px solid rgba(217, 164, 65, 0.25); }

    .tool-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }

    .card-meta {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
    }
    .price-tag { font-size: 15px; font-weight: 700; color: var(--ink); }

    .endpoint-tag {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--faint);
      margin-top: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Empty state */
    .empty-box {
      text-align: center;
      padding: 64px 20px;
      background: var(--bg-raised);
      border: 1px dashed var(--border);
      border-radius: var(--r-md);
      grid-column: 1 / -1;
    }
    .empty-box p { color: var(--muted); margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="logo" href="/">try<em>x402</em></a>
      <div class="nav-links">
        <a href="/tools" class="active">Catalogue</a>
        <a href="/provider">Fournisseurs</a>
        <a href="/docs">Docs</a>
        <a href="https://github.com/crypto-yannso/tryx402" target="_blank">GitHub ↗</a>
        <a class="btn-cta" href="/provider">+ Référencer une API</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="hero-head">
      <div>
        <div class="tag">Catalogue Découverte Machine-à-Machine</div>
        <h1>APIs & Outils pay-per-call pour Agents</h1>
        <p class="lede">Explorez les microservices référencés. Exécutables directement via l'OpenRouter des paiements avec votre clé tryx402.</p>
      </div>
      <div>
        <a href="/provider" class="btn-cta">+ Proposer un outil</a>
      </div>
    </div>

    <div class="controls">
      <div class="tabs">
        <button id="tab-active" onclick="switchTab(true)" class="tab-btn active">Outils Actifs</button>
        <button id="tab-all" onclick="switchTab(false)" class="tab-btn">Tous (avec en attente)</button>
      </div>
      <div id="countLabel" class="tools-count">Chargement...</div>
    </div>

    <div id="toolsGrid" class="grid">
      <!-- Generated via JS -->
    </div>
  </div>

  <script>
    let activeOnly = true;

    function switchTab(active) {
      activeOnly = active;
      document.getElementById('tab-active').className = active ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-all').className = !active ? 'tab-btn active' : 'tab-btn';
      renderTools();
    }

    async function renderTools() {
      const grid = document.getElementById('toolsGrid');
      const countEl = document.getElementById('countLabel');
      grid.innerHTML = '<div class="empty-box"><p>Chargement des outils en cours...</p></div>';

      try {
        const res = await fetch(`/api/v1/tools?active_only=${activeOnly}`);
        const data = await res.json();

        if (!data.success || !data.tools || data.tools.length === 0) {
          countEl.innerText = '0 outil disponible';
          grid.innerHTML = `
            <div class="empty-box">
              <p>Aucun outil disponible dans cette vue.</p>
              <a href="/provider" style="color:var(--accent); font-size:13px; text-decoration:none; font-weight:600;">Référencez le vôtre en 2 minutes →</a>
            </div>
          `;
          return;
        }

        countEl.innerText = `${data.tools.length} outil(s) référencé(s)`;

        grid.innerHTML = data.tools.map(t => `
          <div class="tool-card">
            <div>
              <div class="card-top">
                <span class="tool-slug">${escape(t.slug)}</span>
                <span class="badge ${t.is_active ? 'badge-active' : 'badge-pending'}">${t.is_active ? 'Actif' : 'En attente'}</span>
              </div>
              <p class="tool-desc">${escape(t.description || 'Microservice x402 pour agents autonomes.')}</p>
            </div>

            <div>
              <div class="card-meta">
                <span>Fournisseur : ${escape(t.provider_name)}</span>
                <span class="price-tag">$${t.price_usd} <small style="font-size:10px; font-weight:normal; color:var(--muted);">/call</small></span>
              </div>
              <div class="endpoint-tag" style="display:flex; justify-content:space-between; align-items:center;">
                <div><span style="color:var(--accent); font-weight:600;">${escape(t.method)}</span> ${escape(t.origin)}${escape(t.endpoint)}</div>
                <span style="font-size:10px; color:var(--good); font-family:var(--font-mono); font-weight:600;">✓ HTTP ${t.last_check_status || 200}</span>
              </div>
            </div>
          </div>
        `).join('');

      } catch (e) {
        grid.innerHTML = `<div class="empty-box"><p style="color:var(--bad);">Erreur lors de la récupération des outils : ${e}</p></div>`;
      }
    }

    function escape(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    window.onload = () => renderTools();
  </script>
</body>
</html>
