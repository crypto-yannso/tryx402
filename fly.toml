# fly.toml app configuration file generated for tryx402 on 2026-08-22T19:13:14+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tryx402'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  TRYX402_STORE = '/data/accounts.json'

[[mounts]]
  source = 'tryx402_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.http_checks]]
    interval = '30s'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
