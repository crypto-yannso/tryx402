app = "tryx402"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  TRYX402_DB_PATH = "/data/tryx402_wallets.db"
  TRYX402_TOOLS_DB_PATH = "/data/gateway.db"
  TRYX402_HOST = "0.0.0.0"
  TRYX402_PORT = "8080"

[[mounts]]
  source = "tryx402_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
